<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIXO — A Personalized Workspace</title>
<meta name="theme-color" content="#0a0014">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#1b2140;--mute:#6f7694;--pri:#4457ff;--pri2:#e8ebff;--ok:#18b27c;--warn:#ff8a3d;--line:#e4e8f4;--sh:0 4px 18px rgba(40,50,110,.07);
--f:'Plus Jakarta Sans',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#171b2e;--ink:#e8ebff;--mute:#98a0c4;--pri2:#232a55;--line:#262c48;--sh:none}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#171b2e;--ink:#e8ebff;--mute:#98a0c4;--pri2:#232a55;--line:#262c48;--sh:none}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr) 370px;min-height:100vh}
.mute,.mono{color:var(--mute);font-size:13px}
nav.side{background:var(--card);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin:0 6px 20px}
.logo b{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--pri);color:#fff;font-size:15px}
.nv{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:0;background:none;font-weight:600;color:var(--mute);cursor:pointer;text-align:left;width:100%}
.nv:hover{background:var(--pri2);color:var(--ink)}
.nv[aria-selected=true]{background:var(--pri);color:#fff;box-shadow:0 6px 14px rgba(68,87,255,.3)}
.nv+.gap{margin-top:auto}
.sep{margin:14px 14px 4px;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.04em}
main{padding:24px 28px 90px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.top h1{font-size:26px;margin:0;font-weight:800}
.av{width:42px;height:42px;border-radius:50%;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-weight:800}
.hero{background:linear-gradient(120deg,#3f4fe8,#6f5bff);color:#fff;border-radius:22px;padding:28px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:0 12px 28px rgba(68,87,255,.28)}
.hero h2{margin:0 0 6px;font-size:26px;font-weight:800}.hero p{margin:0 0 16px;opacity:.9;max-width:46ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.stat b{display:block;font-size:30px;font-weight:800;margin:4px 0 0}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--pri2);margin-bottom:8px}
h3.sec{font-size:18px;font-weight:800;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--pri);background:var(--pri2);border-radius:99px;padding:2px 10px}
.course h4{margin:10px 0 12px;font-size:17px}
.bar{height:8px;border-radius:99px;background:var(--pri2);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.bar.ok i{background:var(--ok)}
.btn{display:inline-block;border:0;background:var(--pri);color:#fff;font-weight:700;border-radius:12px;padding:10px 18px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}.btn.alt{background:var(--pri2);color:var(--pri)}.btn.ghost{background:#fff;color:var(--pri)}.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}.btn.red{background:none;color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sb{justify-content:space-between}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;max-width:100%}
textarea{width:100%;min-height:60px}
.sk{display:grid;grid-template-columns:150px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sk:last-child{border:0}.pc{font-weight:800;min-width:42px;text-align:right}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}
.task.done b{text-decoration:line-through;opacity:.5}.over{color:var(--warn);font-weight:700}
.doc{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}.doc:last-child{border:0}
.note{background:var(--pri2);border-radius:14px;padding:12px 16px;margin:0 0 14px;font-size:14px}
aside{position:sticky;top:0;height:100vh;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--card)}
aside h2{font-size:18px;font-weight:800;margin:0;padding:22px 20px 2px}
#log{flex:1;overflow:auto;padding:12px 20px;display:grid;gap:10px;align-content:start}
.m{max-width:92%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{justify-self:end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}.m.b{background:var(--bg);border-bottom-left-radius:4px}
.m .dl{display:inline-block;margin-top:8px;border:0;cursor:pointer;background:var(--pri);color:#fff;border-radius:10px;padding:4px 12px;font:700 14px var(--f)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 8px}
.chips button{border:0;background:var(--pri2);color:var(--pri);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
#f{display:flex;gap:8px;padding:12px 20px 20px;border-top:1px solid var(--line)}#f input{flex:1;min-width:0}
#fab{display:none}#close{display:none;margin:14px 20px 0;align-self:flex-start}
@media (max-width:1180px){
 .app{grid-template-columns:200px minmax(0,1fr)}
 aside{position:fixed;inset:0;height:100%;z-index:30;display:none}aside.open{display:flex}
 #fab{display:block;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;border-radius:99px;box-shadow:0 8px 20px rgba(68,87,255,.4)}
 #close{display:inline-block}
}
@media (max-width:760px){
 .app{grid-template-columns:1fr}
 nav.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:12px;gap:4px;border-right:0;border-bottom:1px solid var(--line)}
 .logo,.sep,.nv+.gap{display:none}.nv{width:auto;white-space:nowrap;padding:8px 14px}
 main{padding:18px 16px 90px}.sk{grid-template-columns:1fr auto}
}
.opt{display:block;width:100%;text-align:left;margin:8px 0}.opt.right{background:#18b27c;color:#fff}.opt.wrong{background:var(--warn);color:#fff}.btn:disabled{opacity:.5;cursor:default;filter:none}.m a{color:inherit;text-decoration:underline;overflow-wrap:anywhere}
@media (max-width:760px){.sk .row,.sk .bar{grid-column:1/-1}}

/* ===== cinematic 3D theme ===== */
html:root:root{color-scheme:dark;--bg:#0c0c0d;--card:#141416;--ink:#f4f4f5;--mute:#9a9aa3;--pri:#ff7a1a;--pri2:rgba(255,122,26,.14);--ok:#2fd18b;--warn:#ff5d5d;--line:rgba(255,255,255,.09);--sh:0 24px 60px rgba(0,0,0,.55)}
body{background:radial-gradient(900px 520px at 85% -8%,rgba(255,122,26,.20),transparent 62%),radial-gradient(700px 500px at -10% 40%,rgba(255,179,71,.07),transparent 60%),var(--bg);letter-spacing:-.005em}
nav.side,aside{background:rgba(18,18,20,.5);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.logo b{background:linear-gradient(135deg,#ff7a1a,#ffb347);color:#1a0d00}
.nv:hover{background:rgba(255,255,255,.06)}
.nv[aria-selected=true]{background:linear-gradient(135deg,#ff7a1a,#ff9a3c);color:#1a0d00;box-shadow:0 10px 24px rgba(255,122,26,.35)}
.btn{background:linear-gradient(135deg,#ff7a1a,#ffa24a);color:#1a0d00;box-shadow:0 8px 22px rgba(255,122,26,.3)}
.btn.alt{background:rgba(255,255,255,.07);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);box-shadow:none}
.btn.red{background:none;box-shadow:none;border:0;color:var(--warn)}
.av{background:var(--pri2);color:#ffb347}.tag{color:#ffb347}
.bar{background:rgba(255,255,255,.08)}.bar i{background:linear-gradient(90deg,#ff7a1a,#ffc15e)}.bar.ok i{background:var(--ok)}
.opt.right{background:var(--ok);color:#06210f}.opt.wrong{background:var(--warn);color:#2a0606}
input,select,textarea{background:rgba(255,255,255,.05);color:var(--ink)}
.m.u{background:linear-gradient(135deg,#ff7a1a,#ffa24a);color:#1a0d00}.m.b{background:rgba(255,255,255,.06)}
.m .dl{background:#ff7a1a;color:#1a0d00}
.chips button{background:rgba(255,255,255,.07);color:#ffb347}
.card{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),var(--card);border:1px solid var(--line)}
.hero{position:relative;overflow:hidden;perspective:1200px;padding:34px;background:linear-gradient(135deg,#1c1209 0%,#2a1607 48%,#101011 100%);border:1px solid rgba(255,122,26,.28);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;top:-35%;right:-8%;width:55%;aspect-ratio:1;background:radial-gradient(circle,rgba(255,122,26,.38),transparent 65%);pointer-events:none}
.hero>*{position:relative}
.hero h2{font-size:clamp(30px,4.2vw,46px);line-height:1.05;letter-spacing:-.03em}
.hero p.eyebrow{font:700 12px var(--f);letter-spacing:.16em;text-transform:uppercase;color:#ffb347;margin:0 0 10px;max-width:none}
.stage{--rx:0deg;--ry:0deg;position:relative;width:300px;height:230px;flex:none;margin-right:24px;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .15s ease-out}
.layer{position:absolute;display:grid;gap:3px;border-radius:18px;padding:14px 16px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.03));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 26px 44px rgba(0,0,0,.5)}
.layer b{font:800 34px/1 var(--f)}.layer span{font-size:12px;color:var(--mute)}
.l1{inset:0 110px 60px 0;transform:translateZ(20px);align-content:center}
.l2{right:0;top:30px;width:140px;transform:translateZ(75px);animation:fl 5s ease-in-out infinite}
.l3{left:34px;bottom:0;width:190px;transform:translateZ(120px);background:linear-gradient(145deg,#ff7a1a,#ffa24a);color:#1a0d00;border-color:rgba(255,255,255,.3);animation:fl 6s ease-in-out infinite reverse}
.l3 span{color:rgba(26,13,0,.75)}
@keyframes fl{50%{translate:0 -9px}}
.marq{overflow:hidden;white-space:nowrap;margin:20px 0 4px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marq div{display:inline-block;animation:mq2 32s linear infinite}
.marq span{margin:0 24px;font:700 13px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.marq span::after{content:"✳";margin-left:48px;color:#ff7a1a}
@keyframes mq2{to{transform:translateX(-50%)}}
.cols .card,.stats .card{position:relative;transform-style:preserve-3d;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,box-shadow .2s;will-change:transform}
.cols .card:hover,.stats .card:hover{box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,122,26,.4)}
.cols .card::after,.stats .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.13),transparent 60%)}
.cols .card:hover::after,.stats .card:hover::after{opacity:1}
.cols .card h4,.cols .card .row,.stats .card b{transform:translateZ(26px)}
.hero{flex-wrap:nowrap;gap:24px}.hero>div:first-child{flex:1;min-width:0}
@media (max-width:760px){.hero{flex-wrap:wrap;padding:24px}.stage{margin:20px auto 0}}
@media (max-width:1180px){aside{background:#0f0f11}}
@media (prefers-reduced-motion:reduce){.l2,.l3,.marq div{animation:none}.stage,.cols .card,.stats .card{transition:none}}

/* ===== video background + mobile ===== */
html{overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.bgo{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 520px at 85% -8%,rgba(255,122,26,.16),transparent 62%),linear-gradient(90deg,rgba(8,8,10,.62),rgba(8,8,10,.22))}
.app{position:relative;z-index:1}
.top h1,.top .mute,.brand{text-shadow:0 2px 14px rgba(0,0,0,.75)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),rgba(20,20,22,.5)}

.btn.sm{min-height:36px}
@media (max-width:760px){#toplinks{display:none!important}}
.wk{display:flex;gap:8px;align-items:flex-end;height:96px}.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}.wk i{width:100%;max-width:34px;border-radius:6px;background:linear-gradient(180deg,#ffc15e,#ff7a1a)}.wk span{font-size:11px;color:var(--mute)}

@media (max-width:760px){.brand{display:block}}
@media (min-width:1500px){main{padding-left:44px;padding-right:44px}.app{grid-template-columns:260px minmax(0,1fr) 400px}}
@media (max-width:760px){
 nav.side{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;padding:10px 12px;gap:6px;-webkit-overflow-scrolling:touch}
 .nv{padding:9px 14px;min-height:40px;font-size:14px}
 main{padding:16px 14px 96px}
 .top{flex-wrap:wrap;gap:8px}.top h1{font-size:22px}.top>.row>.btn{display:none}
 .hero{padding:22px 18px;border-radius:18px}.hero h2{font-size:30px}.hero p{font-size:14px}
 .stage{width:min(300px,100%);margin:20px auto 0}
 .stats{grid-template-columns:1fr 1fr;gap:10px}.stat b{font-size:24px}.card{padding:16px;border-radius:16px}
 h3.sec{font-size:17px;flex-wrap:wrap;gap:8px}
 .sk{grid-template-columns:1fr auto;gap:8px 10px;padding:12px 0}.sk>b{grid-column:1}.sk .pc{grid-column:2;grid-row:1}.sk .bar{grid-column:1/-1;grid-row:2}.sk .row{grid-column:1/-1;grid-row:3}
 .task{grid-template-columns:auto 1fr}.task .btn{grid-column:1/-1;justify-self:start}
 form.row input:not([type=checkbox]),form.row select{flex:1 1 100%}
 .marq span{margin:0 16px}
 #f{padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px))}#log{padding:10px 14px}.chips{padding:0 14px 8px}
}
@media (max-width:380px){.stats{grid-template-columns:1fr}.hero h2{font-size:26px}}

/* ===== YOLO.EXE theme: neon on deep purple, detection boxes, 3D scene ===== */
html:root:root{--bg:#0a0014;--card:#12001f;--ink:#fff;--mute:#bba9dd;--pri:#ff2bd6;--pri2:rgba(255,43,214,.14);--ok:#00e5ff;--warn:#ffe600;--line:rgba(255,255,255,.18);--pk:#ff2bd6;--yl:#ffe600;--cy:#00e5ff;--d:'Archivo Black',Impact,system-ui,sans-serif;--f:'Space Mono',ui-monospace,Menlo,Consolas,monospace;--sh:none}
body{background:radial-gradient(900px 520px at 85% -8%,rgba(255,43,214,.22),transparent 62%),var(--bg);font-size:14px;letter-spacing:0}
.bgo{background:radial-gradient(900px 520px at 85% -8%,rgba(255,43,214,.20),transparent 62%),linear-gradient(rgba(0,229,255,.07) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(0,229,255,.07) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(10,0,20,.74),rgba(10,0,20,.36))}
nav.side,aside{background:rgba(10,0,20,.7)}
@media (max-width:1180px){aside{background:#0a0014}}
.logo{font-family:var(--d);text-transform:uppercase;letter-spacing:.02em}
.logo b{background:var(--pk);color:#0a0014;border-radius:4px;box-shadow:3px 3px 0 var(--cy)}
.nv{border-radius:4px;text-transform:uppercase;font-size:12.5px;letter-spacing:.05em}
.nv:hover{background:rgba(255,255,255,.08)}
.nv[aria-selected=true]{background:var(--yl);color:#0a0014;box-shadow:4px 4px 0 var(--pk)}
.sep{color:var(--cy)}
.av{background:var(--pk);color:#0a0014;border-radius:6px;font-family:var(--d)}
.brand b{color:var(--yl)}
.top h1,h3.sec,.card h4,.stat b,.pc,.layer b{font-family:var(--d);text-transform:uppercase;font-weight:400}
.top h1{font-size:30px}
h3.sec::before{content:"▣ ";color:var(--pk)}
.btn{background:var(--yl);color:#0a0014;border:2px solid #0a0014;border-radius:6px;text-transform:uppercase;font-size:12.5px;letter-spacing:.04em;box-shadow:4px 4px 0 var(--pk);transition:transform .12s,box-shadow .12s}
.btn:hover{filter:none;transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--pk)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pk)}
.btn.alt{background:rgba(10,0,20,.55);color:var(--cy);border:2px solid var(--cy);box-shadow:3px 3px 0 rgba(0,229,255,.35)}
.btn.ghost{background:rgba(10,0,20,.55);color:var(--yl);border:2px solid var(--yl);box-shadow:3px 3px 0 var(--pk)}
.btn.red{background:none;border:0;box-shadow:none;color:var(--warn)}
.btn.sm{border-radius:4px}
.card{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01)),rgba(18,0,31,.62);border:1px solid var(--line);border-radius:4px}
.card::before{content:"";position:absolute;inset:-2px;pointer-events:none;border-radius:4px;background:linear-gradient(var(--cy),var(--cy)) 0 0/18px 3px,linear-gradient(var(--cy),var(--cy)) 0 0/3px 18px,linear-gradient(var(--cy),var(--cy)) 100% 0/18px 3px,linear-gradient(var(--cy),var(--cy)) 100% 0/3px 18px,linear-gradient(var(--cy),var(--cy)) 0 100%/18px 3px,linear-gradient(var(--cy),var(--cy)) 0 100%/3px 18px,linear-gradient(var(--cy),var(--cy)) 100% 100%/18px 3px,linear-gradient(var(--cy),var(--cy)) 100% 100%/3px 18px;background-repeat:no-repeat}
.cols .card:hover,.stats .card:hover{box-shadow:6px 6px 0 var(--pk)}
.cols .card:hover::before,.stats .card:hover::before{filter:hue-rotate(-90deg)}
.tag{background:var(--pk);color:#0a0014;border-radius:2px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.ico{border-radius:4px;background:rgba(255,230,0,.14)}
.note{background:rgba(255,230,0,.08);border-left:4px solid var(--yl);border-radius:0}
.bar{height:10px;border-radius:0;background:rgba(255,255,255,.1)}
.bar i{border-radius:0;background:repeating-linear-gradient(90deg,var(--pk) 0 10px,var(--yl) 10px 20px)}
.bar.ok i{background:var(--cy)}
input,select,textarea{border:2px solid rgba(0,229,255,.55);border-radius:4px;background:rgba(10,0,20,.6)}
.m{border-radius:4px}.m.u{background:var(--yl);color:#0a0014}.m.b{background:rgba(255,255,255,.07);border:1px solid var(--line)}
.m .dl{background:var(--pk);color:#0a0014;border-radius:3px}
.chips button{background:none;border:1px solid var(--cy);color:var(--cy);border-radius:2px}
#fab{border-radius:6px}
.wk i{background:linear-gradient(180deg,var(--yl),var(--pk));border-radius:0}
.hero{background:rgba(10,0,20,.55);border:2px solid var(--pk);border-radius:8px;box-shadow:8px 8px 0 var(--cy);padding:30px}
.hero::before{background:radial-gradient(circle,rgba(255,43,214,.35),transparent 65%)}
.hero p.eyebrow{color:var(--cy);letter-spacing:.14em}

const MDN='https://developer.mozilla.org/en-US/docs/Learn_web_development';

let S={skills:[],tasks:[],docs:[],lc:{days:{}}};

 S.skills=SK.flatMap(([g,l])=>l.map(([n,u])=>({id:uid(),n,g,u,p:(o.find(x=>x.n===n)||{}).p||0})))}
 S.cs=S.cs||{};S.skills=S.skills.filter(s=>s.g!=='Soft Skills');S.q=S.q||{};S.q.p=S.q.p||{};S.tasks=S.tasks||[];S.docs=S.docs||[];S.lc=S.lc||{days:{}};S.vw=S.vw||{};S.pl=S.pl||{};S.links=Object.assign({gh:'vishnuprasath2406',li:'https://www.linkedin.com/feed/',pf:'https://vishnuprasath2406.github.io/PORTFOLIO/'},S.links||{});S.lc.goal=S.lc.goal||100}
try{const x=JSON.parse(localStorage.getItem('vp_ws')||'null');if(x)S=x}catch(e){}
norm();

const solved=()=>Object.values(S.lc.days).reduce((a,b)=>a+b,0);
function streak(){let d=new Date(),n=0;if(!S.lc.days[d.toLocaleDateString('en-CA')])d.setDate(d.getDate()-1);
 while(S.lc.days[d.toLocaleDateString('en-CA')]>0){n++;d.setDate(d.getDate()-1)}return n}

const due=()=>S.tasks.filter(t=>!t.done&&t.due&&t.due<=today());
const lcPct=()=>Math.min(100,Math.round(solved()/(S.lc.goal||100)*100));
const vDone=()=>S.skills.reduce((a,s)=>a+((S.vw[s.id]||{}).ta?1:0)+((S.vw[s.id]||{}).en?1:0),0);
const vPct=()=>S.skills.length?Math.round(vDone()/(S.skills.length*2)*100):0;
let GH={d:null,err:null,loading:false};
const ghPct=()=>GH.d?Math.min(100,Math.round(GH.d.act/20*100)):0;
const perfRows=()=>GH.d?[['Skills (quizzes)',avg(),'40%'],['LeetCode',lcPct(),'25%'],['Videos watched',vPct(),'15%'],['GitHub activity',ghPct(),'20%']]:[['Skills (quizzes)',avg(),'50%'],['LeetCode',lcPct(),'30%'],['Videos watched',vPct(),'20%']];
const perf=()=>Math.round(perfRows().reduce((a,x)=>a+x[1]*parseInt(x[2])/100,0));
const week=()=>{const o=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);o.push([d.toLocaleDateString('en',{weekday:'short'}).slice(0,2),S.lc.days[d.toLocaleDateString('en-CA')]||0])}return o};

const CAT={ai:'AI & ML',py:'Python & DSA',be:'Backend & Web',cloud:'Cloud & DevOps',xr:'Vision & XR'};
const CO=[
['ml','Machine Learning Specialization','Coursera · DeepLearning.AI','ai','Data Analysis','https://www.coursera.org/specializations/machine-learning-introduction',0],
['fastai','Practical Deep Learning for Coders','fast.ai','ai','Python','https://course.fast.ai/',1],

['cs50p','CS50’s Introduction to Programming with Python','Harvard CS50','py','Python','https://cs50.harvard.edu/python/',1],
['cs50x','CS50x: Introduction to Computer Science','Harvard CS50','py','C','https://cs50.harvard.edu/x/',1],
['neet','NeetCode Roadmap','NeetCode','py','Problem-Solving','https://neetcode.io/roadmap',0],
['atbs','Automate the Boring Stuff with Python','Al Sweigart','py','Automation','https://automatetheboringstuff.com/',1],
['fapi','FastAPI Tutorial','FastAPI docs','be','FastAPI','https://fastapi.tiangolo.com/tutorial/',1],
['djg','Django Girls Tutorial','Django Girls','be','Django','https://tutorial.djangogirls.org/en/',1],
['fso','Full Stack Open','University of Helsinki','be','Full-Stack Development','https://fullstackopen.com/en/',1],
['odin','The Odin Project','The Odin Project','be','JavaScript','https://www.theodinproject.com/',1],
['sql','SQL Tutorial','Mode','be','SQL','https://mode.com/sql-tutorial/',1],
['sd','System Design Primer','GitHub','be','Full-Stack Development','https://github.com/donnemartin/system-design-primer',1],
['git','Pro Git (book)','git-scm.com','cloud','Full-Stack Development','https://git-scm.com/book/en/v2',1],
['dock','Docker: Get Started','Docker docs','cloud','Full-Stack Development','https://docs.docker.com/get-started/',1],
['k8s','Kubernetes Basics','Kubernetes docs','cloud','Full-Stack Development','https://kubernetes.io/docs/tutorials/kubernetes-basics/',1],
['aws','AWS Skill Builder','AWS','cloud','Full-Stack Development','https://skillbuilder.aws/',0],
['mlops','MLOps Zoomcamp','DataTalksClub','cloud','Automation','https://github.com/DataTalksClub/mlops-zoomcamp',1],
['yolo','Ultralytics YOLO docs','Ultralytics','xr','Data Analysis','https://docs.ultralytics.com/',1],
['ue','Unreal Engine learning paths','Epic Games','xr','C','https://dev.epicgames.com/community/unreal-engine/learning',1]];

const recC=(k,names)=>CO.filter(c=>(S.cs[c[0]]||0)<2&&names.includes(c[4])).concat(CO.filter(c=>(S.cs[c[0]]||0)<2)).filter((c,i,a)=>a.indexOf(c)===i).slice(0,k);
function ccard(c){const s=S.cs[c[0]]||0;return `<div class="card course"><div class="row sb"><span class="tag">${CAT[c[3]]}</span>${c[6]?'<span class="tag">Free</span>':''}</div><h4>${esc(c[1])}</h4><p class="mute" style="margin:0 0 12px">${esc(c[2])} · builds ${esc(c[4])}</p><div class="row sb"><button class="btn ${s==2?'':'alt'} sm" data-cs="${c[0]}">${ST[s]}</button><a class="btn sm" target="_blank" rel="noopener" href="${esc(c[5])}">Open ↗</a></div></div>`}

 return `<div class="note">Courses picked for a Python, AI and backend software engineering path. ${n(1)} learning · ${n(2)} done of ${CO.length}. Tap the status button to track each one.</div>
 <div class="row" style="margin-bottom:14px">${[['all','All'],...Object.entries(CAT)].map(([k,v])=>`<button class="btn ${cf===k?'':'alt'} sm" data-cf="${k}">${v}</button>`).join('')}</div>
 <div class="cols">${CO.filter(c=>cf==='all'||c[3]===cf).map(ccard).join('')}</div>`}
const QN={C:'C programming',MCP:'Model Context Protocol MCP',Automation:'Python automation','Full-Stack Development':'full stack web development','Data Analysis':'data analysis with Python pandas'};
const vids=n=>{const k=QN[n]||n,y=t=>'https://www.youtube.com/results?search_query='+encodeURIComponent(t);return{ta:y(k+' tutorial in Tamil'),en:y(k+' full course for beginners')}};
const QB=[
['Python','Which of these is mutable?',['tuple','string','list','int'],2],
['Python','What is len({1,2,2,3})?',['4','3','2','1'],1],
['Python','What does [x*2 for x in range(3)] return?',['[0, 2, 4]','[2, 4, 6]','[0, 1, 2]','[1, 2, 3]'],0],
['SQL','Which clause filters rows after GROUP BY?',['WHERE','HAVING','ORDER BY','LIMIT'],1],
['SQL','Which JOIN keeps all rows from the left table?',['INNER JOIN','LEFT JOIN','CROSS JOIN','SELF JOIN'],1],

['C','Which operator gives the address of a variable?',['*','&','->','#'],1],
['C','What is sizeof(char) in C?',['1','2','4','8'],0],
['C','Which function prints formatted output?',['print','printf','echo','cout'],1],

const rnd=seed=>{let a=0;for(const c of seed)a=(a*31+c.charCodeAt(0))|0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const pick=(l,n,seed)=>{const r=rnd(seed),a=[...l];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)};

 else if(k==='weekly')Q={kind:'weekly',title:'Weekly quiz',list:pick(QB,12,'w'+wk()),pts:3};
 else{const s=S.skills.find(x=>x.id===k.slice(2));Q={kind:'p',sid:s.id,title:s.n+' practice',list:QB.filter(q=>q[0]===s.n),pts:2}}
 Q.i=0;Q.a=null;Q.res=[];tab='quizzes';render()}
function finishQ(){const g={};Q.list.forEach((q,i)=>{if(Q.res[i])g[q[0]]=(g[q[0]]||0)+Q.pts});
 for(const[n,v]of Object.entries(g)){const s=S.skills.find(x=>x.n===n);if(s)s.p=Math.min(100,s.p+v)}
 Q.gain=g;Q.c=Q.res.filter(Boolean).length;
 if(Q.kind==='daily'){S.q.d=today();S.q.ds=Q.c}else if(Q.kind==='weekly'){S.q.w=wk();S.q.ws=Q.c}else S.q.p[Q.sid]=today();save()}
function quizzes(){
 if(Q){const q=Q.list[Q.i];
  if(!q)return `<div class="card"><h3 class="sec" style="margin-top:0">${esc(Q.title)} complete</h3><p>You got <b>${Q.c}/${Q.list.length}</b> correct.</p><p class="mute">${Object.entries(Q.gain).map(([n,v])=>n+' +'+v+'%').join(' · ')||'No gains this time. Learn from the answers and try again later.'}</p><button class="btn" data-q="end">Back to quizzes</button></div>`;
  return `<div class="card"><div class="row sb"><span class="tag">${esc(q[0])}</span><span class="mute">Question ${Q.i+1} of ${Q.list.length}</span></div><h3 style="margin:14px 0">${esc(q[1])}</h3>${q[2].map((o,k)=>`<button class="btn alt opt ${Q.a==null?'':k===q[3]?'right':Q.a===k?'wrong':''}" data-ans="${k}" ${Q.a==null?'':'disabled'}>${esc(o)}</button>`).join('')}${Q.a!=null?`<p><b>${Q.a===q[3]?'Correct! ✅':'Not quite. The answer is “'+esc(q[2][q[3]])+'”.'}</b></p><button class="btn" data-q="next">${Q.i+1<Q.list.length?'Next':'Finish'}</button>`:''}</div>`}
 const dd=S.q.d===today(),ww=S.q.w===wk();
 return `<div class="note">Your percentages rise only through quizzes. Daily quiz: +2% per correct answer. Weekly quiz: +3%. Skill practice: +2%, once per skill per day.</div>
 <div class="cols"><div class="card"><span class="tag">Daily</span><h4>Daily quiz</h4><p class="mute">5 questions from your resume skills.${dd?` Today: ${S.q.ds}/5.`:''}</p><button class="btn" data-q="daily" ${dd?'disabled':''}>${dd?'Done · back tomorrow':'Start'}</button></div>

/* ---------- file storage (IndexedDB) ---------- */
const idbOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open('vp_locker',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idb(op,id,val){const db=await idbOpen();return new Promise((res,rej)=>{const s=db.transaction('f',op==='get'?'readonly':'readwrite').objectStore('f');
 const q=op==='put'?s.put(val,id):op==='get'?s.get(id):s.delete(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function openDoc(id){try{const f=await idb('get',id);if(!f){alert('This file is not in this browser’s storage.');return}window.open(URL.createObjectURL(f),'_blank')}catch(e){alert('Could not open the file.')}}

const SKIP=['show','what','give','open','please','tell','about','mine','document','documents','that','this','with','have','need'];
function findDocs(q){const l=q.toLowerCase(),w=l.match(/[a-z0-9]{4,}/g)||[];
 return S.docs.filter(d=>{const h=(d.t+' '+d.c+' '+d.n).toLowerCase();
  return (/mark|result|grade/.test(l)&&/marksheet/i.test(d.c))||(/certificate/.test(l)&&/certificate/i.test(d.c))||(/resume|\bcv\b/.test(l)&&/resume/i.test(d.c))||(/\b(id|aadhaar|passport)\b/.test(l)&&/^id$/i.test(d.c))||w.some(x=>!SKIP.includes(x)&&h.includes(x))})}
const nextSk=()=>[...S.skills].filter(s=>s.g!=='Soft Skills'&&s.p<100).sort((a,b)=>b.p-a.p).slice(0,3);
const ALIAS={javascript:'JavaScript',' js':'JavaScript','full stack':'Full-Stack Development',fullstack:'Full-Stack Development','data analysis':'Data Analysis',pandas:'Data Analysis',mcp:'MCP',python:'Python',sql:'SQL',fastapi:'FastAPI',django:'Django',html:'HTML',css:'CSS',automation:'Automation'};
const skillIn=l=>{for(const k of Object.keys(ALIAS))if(l.includes(k))return ALIAS[k];return /(^|\s)c(\s|$|\?)|c programming/.test(l)?'C':null};
function local(q){const l=q.toLowerCase(),docs=findDocs(q),n=nextSk(),P=[],sk=skillIn(l);
 if(docs.length)P.push('Here’s what I found in your locker:'+docs.map(d=>`\n• ${d.t} (${d.c})${d.n?' — '+d.n:''}`).join(''));
 if(/percent|%|progress|status|how am i|how far|level/.test(l)){const one=sk&&S.skills.find(s=>s.n===sk),top=[...S.skills].filter(s=>s.p>0).sort((a,b)=>b.p-a.p).slice(0,3);
  P.push(one?`${one.n}: ${one.p}%. Overall: ${avg()}%.`:`Overall ${avg()}% across ${S.skills.length} resume skills. ${top.length?'Strongest: '+top.map(s=>s.n+' '+s.p+'%').join(', ')+'.':'Nothing earned yet. Take a quiz to start.'}`);
  P.push(`Performance: ${perf()}%. LeetCode: ${solved()}/${S.lc.goal} solved (${lcPct()}%), ${streak()}-day streak. Videos watched: ${vDone()}/${S.skills.length*2}. Reminders due: ${due().length}.`)}
 if(/video|youtube|watch|tamil|english|tutorial/.test(l)){const nm=sk||(n[0]&&n[0].n)||'Python',v=vids(nm),ta=/tamil/.test(l),en=/english/.test(l);
  P.push(`${nm} videos:`+(en&&!ta?'':'\nTamil: '+v.ta)+(ta&&!en?'':'\nEnglish: '+v.en))}
 if(/quiz|test me|practice/.test(l))P.push(`Daily quiz: ${S.q.d===today()?'done ('+S.q.ds+'/5)':'available'}. Weekly quiz: ${S.q.w===wk()?'done ('+S.q.ws+'/12)':'available'}. Open the Quizzes tab to raise your percentages.`);
 if(/github|commit|repo/.test(l))P.push(GH.d?`GitHub (@${GH.d.login}): ${GH.d.repos} repos, ${GH.d.act} active days and ${GH.d.c30} commits in the last 30 days, ${GH.d.streak}-day streak.`:'GitHub data isn’t loaded yet. Open the GitHub tab.');
 if(/game|play|story|gamif/.test(l))P.push('Learn by playing (open the Play & Stories tab for all of them):\n'+PL.slice(0,22).filter((x,i)=>i%3===0).map(x=>`• ${x[1]} (${PLN[x[2]]}) — ${x[4]}`).join('\n'));
 if(/meetup|luma|event|community/.test(l))P.push('Tech meetups around Chennai:\n'+MT.slice(0,6).map(m=>`• ${m[1]} (${m[2]}) — ${m[4]}`).join('\n')+'\n\nOpen the Meetups tab for the full list.');
 if(!P.length){
  if(/plan|schedule|week|today/.test(l))P.push(`Plan:\n1) ${n[0]?n[0].n+' — watch a video, then take its quiz':'Pick a skill to start'}\n2) Daily quiz\n3) LeetCode — 1 to 2 problems, then log them\n4) ${due().length?'Clear '+due().length+' due reminder(s)':'Add a reminder for tomorrow'}`);
  else if(/learn|next|study|recommend|course/.test(l))P.push((n.length?'Focus next on:\n'+n.map(s=>`• ${s.n} (${s.p}%)`).join('\n'):'Every skill is at 100%.')+'\n\nCourses to try:\n'+recC(3,n.map(s=>s.n)).map(c=>`• ${c[1]} — ${c[5]}`).join('\n'));
  else if(/leetcode|streak|solved/.test(l))P.push(`LeetCode: ${solved()} solved, ${streak()}-day streak, ${S.lc.days[today()]||0} today.`);
  else if(/remind|due|task/.test(l))P.push(due().length?'Due now:\n'+due().map(x=>'• '+x.t).join('\n'):`Nothing due. ${S.tasks.filter(x=>!x.done).length} open reminders in total.`);
  else P.push('Try: “what is my current percentage”, “give me a Python video in Tamil”, “plan my week”, “what should I learn next”, or “show my marksheet”.')}
 return{t:P.join('\n\n'),docs}}
async function claude(q,k){
 const ctx=JSON.stringify({today:today(),resumeSkillProgress:S.skills.map(t=>({skill:t.n,group:t.g,percent:t.p})),leetcode:{solved:solved(),streakDays:streak(),solvedToday:S.lc.days[today()]||0},reminders:S.tasks.filter(t=>!t.done).map(t=>({task:t.t,due:t.due})),documents:S.docs.map(d=>({title:d.t,category:d.c,notes:d.n})),quizzes:{dailyDone:S.q.d===today(),dailyScore:S.q.ds,weeklyDone:S.q.w===wk()},videos:Object.fromEntries(S.skills.map(s=>[s.n,{tamil:vids(s.n).ta,english:vids(s.n).en}])),meetups:MT.map(m=>m[1]+' ['+m[2]+', '+m[3]+']: '+m[4]),courses:{learning:CO.filter(c=>S.cs[c[0]]===1).map(c=>c[1]),done:CO.filter(c=>S.cs[c[0]]===2).map(c=>c[1]),catalog:CO.map(c=>c[1]+' ['+c[4]+']')}});
 const system=`You are the personal trainer and assistant inside Vishnu’s workspace. He is a final-year CSE student aiming for software engineering roles in Python, AI and backend. Answer briefly and concretely using only this data: ${ctx}. The skills tracked are exactly the ones on his resume. For progress questions, quote the real numbers and suggest a next step. For plans, give a short prioritized list. State marks only if they appear in document notes; otherwise say the notes don’t include them. When asked for his percentage, give the overall percent and the relevant skill percents, and say percentages rise only through the daily, weekly and practice quizzes. When asked for a video, give both the Tamil and English YouTube links from the videos data for the skill he names (or his lowest skill if none), as plain URLs. Never invent data.`;
 const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
  body:JSON.stringify({model:MODEL,max_tokens:700,system,messages:[...hist.slice(-8),{role:'user',content:q}]})});
 if(!r.ok)throw new Error(r.status);const j=await r.json();return j.content.filter(c=>c.type==='text').map(c=>c.text).join('')}
async function send(q){
 bubble('u',q);const el=bubble('b','Thinking…');let docs=findDocs(q),text=null;const k=key();

}

{const v=$('#bg');if(v){v.muted=true;v.defaultMuted=true;v.setAttribute('playsinline','');

<script>
window.addEventListener('load',()=>{
/* ---- 1. aptitude + logic skills and questions ---- */
SK.push(['Aptitude & Logic',[['Quantitative Aptitude','https://www.indiabix.com/aptitude/questions-and-answers/'],['Logical Reasoning','https://www.indiabix.com/logical-reasoning/questions-and-answers/']]]);
SK[SK.length-1][1].forEach(([n,u])=>{if(!S.skills.some(s=>s.n===n))S.skills.push({id:uid(),n,g:'Aptitude & Logic',u,p:0})});
S.q.h=S.q.h||[];S.q.cat=S.q.cat||{};
QN['Quantitative Aptitude']='quantitative aptitude shortcuts';
QN['Logical Reasoning']='logical reasoning for placements';
Object.assign(ALIAS,{aptitude:'Quantitative Aptitude',logical:'Logical Reasoning',reasoning:'Logical Reasoning'});
const QA='Quantitative Aptitude',LR='Logical Reasoning';
QB.push(
[QA,'What is 15% of 240?',['24','30','36','40'],2],
[QA,'A train 120 m long passes a pole in 6 seconds. Its speed is?',['72 km/h','60 km/h','20 km/h','36 km/h'],0],
[QA,'6 workers finish a job in 10 days. How many days will 12 workers take?',['20','5','8','15'],1],
[QA,'Simple interest on ₹5,000 at 8% per year for 3 years?',['₹1,000','₹1,200','₹1,500','₹2,400'],1],
[QA,'What is the average of 12, 18, 24, 30 and 36?',['21','24','27','30'],1],
[QA,'A shirt costing ₹800 is sold at a 25% discount. The selling price is?',['₹500','₹600','₹650','₹700'],1],
[QA,'Two numbers are in the ratio 3:5 and their sum is 64. The larger number is?',['24','32','40','48'],2],
[QA,'A can finish a work in 12 days and B in 6 days. Together they take?',['3 days','4 days','6 days','9 days'],1],
[QA,'Which is the next prime number after 31?',['33','35','37','39'],2],
[QA,'Cost price ₹400 and selling price ₹500. The profit percentage is?',['20%','25%','30%','10%'],1],
[QA,'If x + 1/x = 3, what is x² + 1/x²?',['5','7','9','11'],1],
[QA,'In how many ways can 4 different books be arranged on a shelf?',['12','16','24','48'],2],
[LR,'Complete the series: 2, 6, 12, 20, 30, ?',['40','42','44','36'],1],
[LR,'Find the odd one out: Linux, Windows, macOS, Chrome',['Linux','Windows','macOS','Chrome'],3],
[LR,'If A=1, B=2, C=3 and so on, what is the sum of the letters in BAD?',['6','7','8','9'],1],
[LR,'All cats are animals. Some animals are pets. Which statement must be true?',['All cats are pets','Some cats are pets','All cats are animals','No pet is a cat'],2],
[LR,'Ravi is taller than Sam. Sam is taller than Tom. Who is the shortest?',['Ravi','Sam','Tom','Cannot say'],2],
[LR,'Pointing to a man, Asha says, “He is my mother’s only brother’s son.” He is Asha’s?',['Cousin','Brother','Uncle','Nephew'],0],
[LR,'Complete the series: 3, 9, 27, 81, ?',['162','243','324','108'],1],
[LR,'You face north, turn right, then turn right again. Which way do you face now?',['North','East','South','West'],2],
[LR,'What is the angle between the clock hands at 3:00?',['60°','75°','90°','120°'],2],
[LR,'Complete the series: 4, 9, 16, 25, ?',['30','34','36','49'],2],
[LR,'Today is Wednesday. What day will it be after 10 days?',['Friday','Saturday','Sunday','Monday'],1],
[LR,'Every coder drinks coffee. Ria does not drink coffee. What follows?',['Ria is a coder','Ria is not a coder','Ria likes tea','Cannot conclude'],1]
);
save();

/* ---- 2. aptitude & logic round (new quiz type) + quiz history ---- */
const _startQ=startQ;
startQ=function(k){if(k!=='apt')return _startQ(k);
 if(S.q.a===today()){Q=null;tab='quizzes';render();return}
 Q={kind:'apt',title:'Aptitude & logic round',list:pick(QB.filter(q=>q[0]===QA||q[0]===LR),10,'a'+today()),pts:2,i:0,a:null,res:[]};tab='quizzes';render()};
const _finishQ=finishQ;
finishQ=function(){_finishQ();delete S.q.p.undefined;
 Q.list.forEach((q,i)=>{const c=S.q.cat[q[0]]=S.q.cat[q[0]]||[0,0];c[1]++;if(Q.res[i])c[0]++});
 if(Q.kind==='apt')S.q.a=today();
 S.q.h.push({d:today(),t:Q.title,c:Q.c,n:Q.list.length});S.q.h=S.q.h.slice(-30);save()};
const _quizzes=quizzes;
quizzes=function(){const h=_quizzes();if(Q)return h;const aa=S.q.a===today();
 const card=`<div class="card"><span class="tag">Aptitude</span><h4>Aptitude &amp; logic round</h4><p class="mute">10 mixed quantitative and logical reasoning questions.${aa?' Done for today.':''}</p><button class="btn" data-q="apt" ${aa?'disabled':''}>${aa?'Done · back tomorrow':'Start'}</button></div>`;
 return h.replace(/<\/div><\/div>\s*(<h3 class="sec">Practice by skill)/,(m,x)=>'</div>'+card+'</div>'+x)};

/* ---- 3. Analysis tab with charts ---- */
TABS.splice(1,0,['analysis','📊','Analysis']);
const _render=render;
render=function(){const t=tab;if(t!=='analysis'){_render();return}
 tab='dash';_render();tab=t;
 document.querySelectorAll('.nv[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
 $('#ttl').textContent='Analysis';$('#view').innerHTML=analysis()};

function radar(items){const n=items.length,cx=130,cy=120,R=84,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[+(cx+Math.cos(a)*R*v/100).toFixed(1),+(cy+Math.sin(a)*R*v/100).toFixed(1)]};
 const ring=[25,50,75,100].map(v=>`<polygon points="${items.map((_,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('');
 const ax=items.map((x,i)=>{const[a,b]=pt(i,114),[x1,y1]=pt(i,100);return `<line x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" stroke="var(--line)"/><text x="${a}" y="${b}" text-anchor="middle" dominant-baseline="middle">${esc(x[0])}</text>`}).join('');
 return `<svg viewBox="0 0 260 240" role="img" aria-label="Radar chart of track progress">${ring}${ax}<polygon points="${items.map((x,i)=>pt(i,x[1]).join(',')).join(' ')}" fill="rgba(201,155,216,.28)" stroke="var(--pk)" stroke-width="2"/>${items.map((x,i)=>{const[a,b]=pt(i,x[1]);return `<circle cx="${a}" cy="${b}" r="3.5" fill="var(--yl)"/>`}).join('')}</svg>`}

function donut(parts){const tot=parts.reduce((a,x)=>a+x[1],0)||1,C=2*Math.PI*50,cols=['var(--pk)','var(--yl)','var(--cy)','#9fd8b8'];let off=0;
 const arcs=parts.map((x,i)=>{const l=x[1]/tot*C,s=`<circle r="50" fill="none" stroke="${cols[i]}" stroke-width="18" stroke-dasharray="${l.toFixed(1)} ${(C-l).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"/>`;off+=l;return s}).join('');
 return `<svg viewBox="0 0 260 130" role="img" aria-label="Performance breakdown"><g transform="translate(65,65) rotate(-90)"><circle r="50" fill="none" stroke="var(--line)" stroke-width="18"/>${arcs}</g><text x="65" y="71" text-anchor="middle" style="font:400 20px var(--d);fill:var(--ink)">${perf()}%</text>${parts.map((x,i)=>`<rect x="140" y="${20+i*24}" width="10" height="10" fill="${cols[i]}"/><text x="157" y="${29+i*24}">${esc(x[0])} · ${x[1].toFixed(1)} pts</text>`).join('')}</svg>`}

function lineChart(vals,labs){const W=300,H=150,p=26,mx=Math.max(3,...vals),x=i=>p+i*(W-2*p)/(vals.length-1),y=v=>H-p-v/mx*(H-2*p);
 const pts=vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="LeetCode problems per day"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="var(--line)"/><line x1="${p}" y1="${y(mx/2)}" x2="${W-p}" y2="${y(mx/2)}" stroke="var(--line)" stroke-dasharray="3 4"/><polygon points="${p},${H-p} ${pts} ${W-p},${H-p}" fill="rgba(140,199,212,.16)"/><polyline points="${pts}" fill="none" stroke="var(--cy)" stroke-width="2.5" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="var(--yl)"/>`).join('')}<text x="${p}" y="${H-8}">${labs[0]}</text><text x="${W-p}" y="${H-8}" text-anchor="end">${labs[labs.length-1]}</text><text x="${p}" y="14">peak ${mx}</text></svg>`}

function analysis(){
 const sorted=[...S.skills].sort((a,b)=>b.p-a.p),cat=Object.entries(S.q.cat);
 let c=0,t=0;cat.forEach(([,v])=>{c+=v[0];t+=v[1]});const acc=t?Math.round(c/t*100):0;
 const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return[d.toLocaleDateString('en',{day:'numeric',month:'short'}),S.lc.days[d.toLocaleDateString('en-CA')]||0]});
 const hq=S.q.h.slice(-10);
 const rad=SK.map(([g])=>[g.split(/[ &]/)[0],mean(S.skills.filter(s=>s.g===g))]).concat([['Accuracy',acc]]);
 const parts=perfRows().map(([n,p,w])=>[n.split(' ')[0],p*parseInt(w)/100]);
 const best=sorted[0],low=sorted[sorted.length-1];
 const bars=l=>l.map(s=>`<div style="margin:8px 0"><div class="row sb"><span>${esc(s[0])}</span><b>${s[1]}%${s[2]?` <span class="mute">(${s[2]})</span>`:''}</b></div><div class="bar"><i style="width:${s[1]}%"></i></div></div>`).join('');
 const insight=best.p>0?`Strongest skill: <b>${esc(best.n)}</b> (${best.p}%). Needs most attention: <b>${esc(low.n)}</b> (${low.p}%). Quiz accuracy so far: ${acc}%.`:'Take a few quizzes and these charts will fill in with your real progress.';
 return `<div class="note">${insight}</div>
 <div class="stats"><div class="card stat"><div class="ico">📈</div><span class="mute">Performance</span><b>${perf()}%</b></div><div class="card stat"><div class="ico">🎯</div><span class="mute">Quiz accuracy</span><b>${acc}%</b></div><div class="card stat"><div class="ico">📝</div><span class="mute">Quizzes taken</span><b>${S.q.h.length}</b></div><div class="card stat"><div class="ico">⌨</div><span class="mute">LeetCode, 14 days</span><b>${days.reduce((a,x)=>a+x[1],0)}</b></div></div>
 <div class="ch">
 <div class="card"><b>Track strength</b>${radar(rad)}</div>
 <div class="card"><b>What makes up your performance</b>${donut(parts)}</div>
 <div class="card"><b>LeetCode problems, last 14 days</b>${lineChart(days.map(x=>x[1]),days.map(x=>x[0]))}</div>
 <div class="card"><b>Recent quiz scores (%)</b>${hq.length?`<div class="wk" style="height:110px">${hq.map((q,i)=>{const p=Math.round(q.c/q.n*100);return `<div title="${esc(q.t)} · ${q.d}"><span>${p}</span><i style="height:${Math.max(4,Math.round(p*.7))}px"></i><span>${i+1}</span></div>`}).join('')}</div>`:'<p class="mute empty">No quizzes yet. Start the daily quiz.</p>'}</div>
 <div class="card"><b>Accuracy by topic</b>${cat.length?bars(cat.map(([n,v])=>[n,Math.round(v[0]/v[1]*100),v[0]+'/'+v[1]])):'<p class="mute empty">Answer some quiz questions to see topic accuracy.</p>'}</div>
 <div class="card wide"><b>All skills</b>${bars(sorted.map(s=>[s.n,s.p]))}</div>
 </div>`}
render();
});
</script>

  } else if (/\btime\b|clock|how long|session|running/.test(l)) {
