<!-- ===== VIXO UPDATE ===== -->
<style>
/* ---- softer palette ---- */
html:root:root{--bg:#14111d;--card:#1b1727;--ink:#f3f0fa;--mute:#b3aac8;--pri:#c99bd8;--pri2:rgba(201,155,216,.14);--ok:#8fd3b0;--warn:#e8a37a;--line:rgba(255,255,255,.12);--pk:#c99bd8;--yl:#e6cf8f;--cy:#8cc7d4}
body{background:radial-gradient(900px 520px at 85% -8%,rgba(201,155,216,.16),transparent 62%),var(--bg)}
.bgo{background:radial-gradient(900px 520px at 85% -8%,rgba(201,155,216,.14),transparent 62%),linear-gradient(rgba(140,199,212,.04) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(140,199,212,.04) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(20,17,29,.78),rgba(20,17,29,.45))}
nav.side,aside{background:rgba(20,17,29,.78)}
@media (max-width:1180px){aside{background:#14111d}}
.logo b{box-shadow:2px 2px 0 rgba(140,199,212,.5)}
.nv[aria-selected=true]{box-shadow:3px 3px 0 rgba(201,155,216,.45)}
.btn{box-shadow:3px 3px 0 rgba(201,155,216,.4);border-color:transparent}
.btn:hover{box-shadow:4px 4px 0 rgba(201,155,216,.5)}
.btn.alt{border:1px solid rgba(140,199,212,.5);box-shadow:none}
.btn.ghost{border:1px solid rgba(230,207,143,.6);box-shadow:none}
.btn.red{border:0;box-shadow:none}
.card{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01)),rgba(27,23,39,.72)}
.card::before{opacity:.4}
.cols .card:hover,.stats .card:hover{box-shadow:4px 4px 0 rgba(201,155,216,.4)}
.note{background:rgba(230,207,143,.07)}
.ico{background:rgba(230,207,143,.1)}
input,select,textarea{border:1px solid rgba(140,199,212,.4);background:rgba(20,17,29,.7)}
.hero{background:rgba(20,17,29,.62);border:1px solid rgba(201,155,216,.5);box-shadow:6px 6px 0 rgba(140,199,212,.3)}
.hero::before{background:radial-gradient(circle,rgba(201,155,216,.22),transparent 65%)}
.bar i{background:repeating-linear-gradient(90deg,var(--pk) 0 10px,#dcc3e6 10px 20px)}
.bar.ok i{background:var(--cy)}
.bx.mon .fr{box-shadow:0 0 14px rgba(201,155,216,.3)}
.floor{box-shadow:0 0 16px rgba(140,199,212,.15)}
.opt.right{background:#8fd3b0;color:#10261b}.opt.wrong{background:#e89a9a;color:#2a0f0f}
.chips button{border-color:rgba(140,199,212,.5)}

/* ---- alignment fixes ---- */
.top{align-items:flex-start}
.top>div:first-child{text-align:left}
.top h1{line-height:1.1}
.card,.note,.hero,.course,.doc,.task>div,.m{text-align:left}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;text-align:center}
.opt{display:flex;justify-content:flex-start;text-align:left}
.nv{align-items:center;line-height:1.2}
.nv>span:first-child{width:20px;text-align:center;flex:none}
h3.sec{align-items:center}
.stat{display:flex;flex-direction:column;align-items:flex-start}
.stat b{line-height:1.1}
.cols .course{display:flex;flex-direction:column}
.cols .course>.row.sb:last-child{margin-top:auto}
.cols .course h4{line-height:1.3}
.sk{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.sk>b{grid-column:1;grid-row:1}.sk .pc{grid-column:2;grid-row:1}
.sk .bar{grid-column:1/-1;grid-row:2}
.sk .row{grid-column:1/-1;grid-row:3;justify-content:flex-start}
.hero{align-items:center}
.scene{margin-inline:auto}
.wk{justify-content:space-between}
.wk span{text-align:center;min-height:14px}
.mute{line-height:1.45}

/* ---- analysis charts ---- */
.ch{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-top:14px}
.ch .card>b{display:block;margin-bottom:10px}
.ch svg{width:100%;height:auto;display:block}
.ch svg text{fill:var(--mute);font:11px var(--f)}
.ch .wide{grid-column:1/-1}
.empty{padding:18px 0;text-align:center}
</style>
<script>
/* ---- 1. aptitude + logic skills and questions ---- */
SK.push(['Aptitude & Logic',[['Quantitative Aptitude','https://www.indiabix.com/aptitude/questions-and-answers/'],['Logical Reasoning','https://www.indiabix.com/logical-reasoning/questions-and-answers/']]]);
SK[SK.length-1][1].forEach(([n,u])=>{if(!S.skills.some(s=>s.n===n))S.skills.push({id:uid(),n,g:'Aptitude & Logic',u,p:0})});
S.q.h=S.q.h||[];S.q.cat=S.q.cat||{};
QN['Quantitative Aptitude']='quantitative aptitude shortcuts';
QN['Logical Reasoning']='logical reasoning for placements';
Object.assign(ALIAS,{aptitude:'Quantitative Aptitude',logical:'Logical Reasoning',reasoning:'Logical Reasoning'});
const QA='Quantitative Aptitude',LR='Logical Reasoning';
QB.push(
[QA,'What is 15% of 240?',['24','30','36','40'],2],
[QA,'A train 120 m long passes a pole in 6 seconds. Its speed is?',['72 km/h','60 km/h','20 km/h','36 km/h'],0],
[QA,'6 workers finish a job in 10 days. How many days will 12 workers take?',['20','5','8','15'],1],
[QA,'Simple interest on ₹5,000 at 8% per year for 3 years?',['₹1,000','₹1,200','₹1,500','₹2,400'],1],
[QA,'What is the average of 12, 18, 24, 30 and 36?',['21','24','27','30'],1],
[QA,'A shirt costing ₹800 is sold at a 25% discount. The selling price is?',['₹500','₹600','₹650','₹700'],1],
[QA,'Two numbers are in the ratio 3:5 and their sum is 64. The larger number is?',['24','32','40','48'],2],
[QA,'A can finish a work in 12 days and B in 6 days. Together they take?',['3 days','4 days','6 days','9 days'],1],
[QA,'Which is the next prime number after 31?',['33','35','37','39'],2],
[QA,'Cost price ₹400 and selling price ₹500. The profit percentage is?',['20%','25%','30%','10%'],1],
[QA,'If x + 1/x = 3, what is x² + 1/x²?',['5','7','9','11'],1],
[QA,'In how many ways can 4 different books be arranged on a shelf?',['12','16','24','48'],2],
[LR,'Complete the series: 2, 6, 12, 20, 30, ?',['40','42','44','36'],1],
[LR,'Find the odd one out: Linux, Windows, macOS, Chrome',['Linux','Windows','macOS','Chrome'],3],
[LR,'If A=1, B=2, C=3 and so on, what is the sum of the letters in BAD?',['6','7','8','9'],1],
[LR,'All cats are animals. Some animals are pets. Which statement must be true?',['All cats are pets','Some cats are pets','All cats are animals','No pet is a cat'],2],
[LR,'Ravi is taller than Sam. Sam is taller than Tom. Who is the shortest?',['Ravi','Sam','Tom','Cannot say'],2],
[LR,'Pointing to a man, Asha says, “He is my mother’s only brother’s son.” He is Asha’s?',['Cousin','Brother','Uncle','Nephew'],0],
[LR,'Complete the series: 3, 9, 27, 81, ?',['162','243','324','108'],1],
[LR,'You face north, turn right, then turn right again. Which way do you face now?',['North','East','South','West'],2],
[LR,'What is the angle between the clock hands at 3:00?',['60°','75°','90°','120°'],2],
[LR,'Complete the series: 4, 9, 16, 25, ?',['30','34','36','49'],2],
[LR,'Today is Wednesday. What day will it be after 10 days?',['Friday','Saturday','Sunday','Monday'],1],
[LR,'Every coder drinks coffee. Ria does not drink coffee. What follows?',['Ria is a coder','Ria is not a coder','Ria likes tea','Cannot conclude'],1]
);
save();

/* ---- 2. aptitude & logic round (new quiz type) + quiz history ---- */
const _startQ=startQ;
startQ=function(k){if(k!=='apt')return _startQ(k);
 if(S.q.a===today()){Q=null;tab='quizzes';render();return}
 Q={kind:'apt',title:'Aptitude & logic round',list:pick(QB.filter(q=>q[0]===QA||q[0]===LR),10,'a'+today()),pts:2,i:0,a:null,res:[]};tab='quizzes';render()};
const _finishQ=finishQ;
finishQ=function(){_finishQ();delete S.q.p.undefined;
 Q.list.forEach((q,i)=>{const c=S.q.cat[q[0]]=S.q.cat[q[0]]||[0,0];c[1]++;if(Q.res[i])c[0]++});
 if(Q.kind==='apt')S.q.a=today();
 S.q.h.push({d:today(),t:Q.title,c:Q.c,n:Q.list.length});S.q.h=S.q.h.slice(-30);save()};
const _quizzes=quizzes;
quizzes=function(){const h=_quizzes();if(Q)return h;const aa=S.q.a===today();
 const card=`<div class="card"><span class="tag">Aptitude</span><h4>Aptitude &amp; logic round</h4><p class="mute">10 mixed quantitative and logical reasoning questions.${aa?' Done for today.':''}</p><button class="btn" data-q="apt" ${aa?'disabled':''}>${aa?'Done · back tomorrow':'Start'}</button></div>`;
 return h.replace(/<\/div><\/div>\s*(<h3 class="sec">Practice by skill)/,(m,x)=>'</div>'+card+'</div>'+x)};

/* ---- 3. Analysis tab with charts ---- */
TABS.splice(1,0,['analysis','📊','Analysis']);
const _render=render;
render=function(){const t=tab;if(t!=='analysis'){_render();return}
 tab='dash';_render();tab=t;
 document.querySelectorAll('.nv[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
 $('#ttl').textContent='Analysis';$('#view').innerHTML=analysis()};

function radar(items){const n=items.length,cx=130,cy=120,R=84,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[+(cx+Math.cos(a)*R*v/100).toFixed(1),+(cy+Math.sin(a)*R*v/100).toFixed(1)]};
 const ring=[25,50,75,100].map(v=>`<polygon points="${items.map((_,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('');
 const ax=items.map((x,i)=>{const[a,b]=pt(i,114),[x1,y1]=pt(i,100);return `<line x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" stroke="var(--line)"/><text x="${a}" y="${b}" text-anchor="middle" dominant-baseline="middle">${esc(x[0])}</text>`}).join('');
 return `<svg viewBox="0 0 260 240" role="img" aria-label="Radar chart of track progress">${ring}${ax}<polygon points="${items.map((x,i)=>pt(i,x[1]).join(',')).join(' ')}" fill="rgba(201,155,216,.28)" stroke="var(--pk)" stroke-width="2"/>${items.map((x,i)=>{const[a,b]=pt(i,x[1]);return `<circle cx="${a}" cy="${b}" r="3.5" fill="var(--yl)"/>`}).join('')}</svg>`}

function donut(parts){const tot=parts.reduce((a,x)=>a+x[1],0)||1,C=2*Math.PI*50,cols=['var(--pk)','var(--yl)','var(--cy)','#9fd8b8'];let off=0;
 const arcs=parts.map((x,i)=>{const l=x[1]/tot*C,s=`<circle r="50" fill="none" stroke="${cols[i]}" stroke-width="18" stroke-dasharray="${l.toFixed(1)} ${(C-l).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"/>`;off+=l;return s}).join('');
 return `<svg viewBox="0 0 260 130" role="img" aria-label="Performance breakdown"><g transform="translate(65,65) rotate(-90)"><circle r="50" fill="none" stroke="var(--line)" stroke-width="18"/>${arcs}</g><text x="65" y="71" text-anchor="middle" style="font:400 20px var(--d);fill:var(--ink)">${perf()}%</text>${parts.map((x,i)=>`<rect x="140" y="${20+i*24}" width="10" height="10" fill="${cols[i]}"/><text x="157" y="${29+i*24}">${esc(x[0])} · ${x[1].toFixed(1)} pts</text>`).join('')}</svg>`}

function lineChart(vals,labs){const W=300,H=150,p=26,mx=Math.max(3,...vals),x=i=>p+i*(W-2*p)/(vals.length-1),y=v=>H-p-v/mx*(H-2*p);
 const pts=vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="LeetCode problems per day"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="var(--line)"/><line x1="${p}" y1="${y(mx/2)}" x2="${W-p}" y2="${y(mx/2)}" stroke="var(--line)" stroke-dasharray="3 4"/><polygon points="${p},${H-p} ${pts} ${W-p},${H-p}" fill="rgba(140,199,212,.16)"/><polyline points="${pts}" fill="none" stroke="var(--cy)" stroke-width="2.5" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="var(--yl)"/>`).join('')}<text x="${p}" y="${H-8}">${labs[0]}</text><text x="${W-p}" y="${H-8}" text-anchor="end">${labs[labs.length-1]}</text><text x="${p}" y="14">peak ${mx}</text></svg>`}

function analysis(){
 const sorted=[...S.skills].sort((a,b)=>b.p-a.p),cat=Object.entries(S.q.cat);
 let c=0,t=0;cat.forEach(([,v])=>{c+=v[0];t+=v[1]});const acc=t?Math.round(c/t*100):0;
 const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return[d.toLocaleDateString('en',{day:'numeric',month:'short'}),S.lc.days[d.toLocaleDateString('en-CA')]||0]});
 const hq=S.q.h.slice(-10);
 const rad=SK.map(([g])=>[g.split(/[ &]/)[0],mean(S.skills.filter(s=>s.g===g))]).concat([['Accuracy',acc]]);
 const parts=perfRows().map(([n,p,w])=>[n.split(' ')[0],p*parseInt(w)/100]);
 const best=sorted[0],low=sorted[sorted.length-1];
 const bars=l=>l.map(s=>`<div style="margin:8px 0"><div class="row sb"><span>${esc(s[0])}</span><b>${s[1]}%${s[2]?` <span class="mute">(${s[2]})</span>`:''}</b></div><div class="bar"><i style="width:${s[1]}%"></i></div></div>`).join('');
 const insight=best.p>0?`Strongest skill: <b>${esc(best.n)}</b> (${best.p}%). Needs most attention: <b>${esc(low.n)}</b> (${low.p}%). Quiz accuracy so far: ${acc}%.`:'Take a few quizzes and these charts will fill in with your real progress.';
 return `<div class="note">${insight}</div>
 <div class="stats"><div class="card stat"><div class="ico">📈</div><span class="mute">Performance</span><b>${perf()}%</b></div><div class="card stat"><div class="ico">🎯</div><span class="mute">Quiz accuracy</span><b>${acc}%</b></div><div class="card stat"><div class="ico">📝</div><span class="mute">Quizzes taken</span><b>${S.q.h.length}</b></div><div class="card stat"><div class="ico">⌨</div><span class="mute">LeetCode, 14 days</span><b>${days.reduce((a,x)=>a+x[1],0)}</b></div></div>
 <div class="ch">
 <div class="card"><b>Track strength</b>${radar(rad)}</div>
 <div class="card"><b>What makes up your performance</b>${donut(parts)}</div>
 <div class="card"><b>LeetCode problems, last 14 days</b>${lineChart(days.map(x=>x[1]),days.map(x=>x[0]))}</div>
 <div class="card"><b>Recent quiz scores (%)</b>${hq.length?`<div class="wk" style="height:110px">${hq.map((q,i)=>{const p=Math.round(q.c/q.n*100);return `<div title="${esc(q.t)} · ${q.d}"><span>${p}</span><i style="height:${Math.max(4,Math.round(p*.7))}px"></i><span>${i+1}</span></div>`}).join('')}</div>`:'<p class="mute empty">No quizzes yet. Start the daily quiz.</p>'}</div>
 <div class="card"><b>Accuracy by topic</b>${cat.length?bars(cat.map(([n,v])=>[n,Math.round(v[0]/v[1]*100),v[0]+'/'+v[1]])):'<p class="mute empty">Answer some quiz questions to see topic accuracy.</p>'}</div>
 <div class="card wide"><b>All skills</b>${bars(sorted.map(s=>[s.n,s.p]))}</div>
 </div>`}
render();
</script>
<!-- ===== end of VIXO UPDATE ===== -->
